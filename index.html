<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Πρόγραμμα Βαρδιών</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial;color:#172033}
main{max-width:1000px;margin:auto;padding:12px}
h1{margin:0 0 12px;padding:16px;background:#1f4e78;color:#fff;text-align:center;border-radius:14px;font-size:21px}
.card{background:#fff;padding:12px;margin-bottom:12px;border-radius:14px;box-shadow:0 2px 10px #0001}
.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea,button{font:inherit;padding:10px;border:1px solid #ccd2da;border-radius:9px}
button{background:#1f4e78;color:white;border:0;font-weight:700}
.gray{background:#e8edf3;color:#172033}.red{background:#b42318}
.scroll{overflow:auto}
table{border-collapse:collapse;min-width:850px;width:100%}
th,td{border:1px solid #aaa;padding:8px;text-align:center}
th{background:#fff2cc}.date td{background:#e2f0d9;font-weight:bold}.shift td{background:#fce4d6}
td select{width:100%}
.grid{display:grid;grid-template-columns:1fr 80px 85px;gap:7px;align-items:center}
.head{font-weight:bold;background:#d9eaf7;padding:8px;border-radius:7px}
#preview{display:none;position:fixed;inset:0;background:#000a;z-index:20;padding:15px;overflow:auto}
#previewBox{max-width:900px;margin:auto;background:white;padding:12px;border-radius:14px}
#preview img{width:100%;border:1px solid #ddd}
.small{font-size:13px;color:#667085}
</style>
</head>
<body>
<main>
<h1>ΕΒΔΟΜΑΔΙΑΙΟ ΠΡΟΓΡΑΜΜΑ ΒΑΡΔΙΩΝ</h1>

<div class="card">
<div class="controls">
<b>Δευτέρα εβδομάδας:</b>
<input id="week" type="date">
<button onclick="thisWeek()" class="gray">Τρέχουσα εβδομάδα</button>
<button onclick="makeImage()">📷 Αποθήκευση εικόνας</button>
<button onclick="clearWeek()" class="red">Καθαρισμός</button>
</div>
</div>

<div class="card scroll">
<table>
<tr>
<th>Βάρδιες</th>
<th>ΔΕΥΤΕΡΑ</th><th>ΤΡΙΤΗ</th><th>ΤΕΤΑΡΤΗ</th>
<th>ΠΕΜΠΤΗ</th><th>ΠΑΡΑΣΚΕΥΗ</th><th>ΣΑΒΒΑΤΟ</th><th>ΚΥΡΙΑΚΗ</th>
</tr>
<tr class="date"><td>Ημερομηνία</td>
<td id="d0"></td><td id="d1"></td><td id="d2"></td><td id="d3"></td><td id="d4"></td><td id="d5"></td><td id="d6"></td>
</tr>
<tr class="shift"><td><b>18:00–00:00</b></td>
<td><select data-s="e" data-d="0"></select></td><td><select data-s="e" data-d="1"></select></td>
<td><select data-s="e" data-d="2"></select></td><td><select data-s="e" data-d="3"></select></td>
<td><select data-s="e" data-d="4"></select></td><td><select data-s="e" data-d="5"></select></td>
<td><select data-s="e" data-d="6"></select></td></tr>
<tr class="shift"><td><b>00:00–06:00</b></td>
<td><select data-s="n" data-d="0"></select></td><td><select data-s="n" data-d="1"></select></td>
<td><select data-s="n" data-d="2"></select></td><td><select data-s="n" data-d="3"></select></td>
<td><select data-s="n" data-d="4"></select></td><td><select data-s="n" data-d="5"></select></td>
<td><select data-s="n" data-d="6"></select></td></tr>
<tr><td><b>Σημειώσεις</b></td><td colspan="7"><textarea id="notes" style="width:100%"></textarea></td></tr>
</table>
</div>

<div class="card">
<h2>Ονόματα προσωπικού</h2>
<div id="people" class="grid"></div>
<div class="controls" style="margin-top:12px">
<input id="newName" placeholder="Νέο όνομα">
<button onclick="addName()">Προσθήκη</button>
</div>
<p class="small">Οι αλλαγές αποθηκεύονται αυτόματα σε αυτή τη συσκευή.</p>
</div>
</main>

<div id="preview"><div id="previewBox">
<h3>Εικόνα προγράμματος</h3>
<img id="img">
<div class="controls" style="margin-top:10px">
<button onclick="shareImage()">Κοινοποίηση / Αποθήκευση</button>
<button onclick="downloadImage()" class="gray">Λήψη PNG</button>
<button onclick="closePreview()" class="gray">Κλείσιμο</button>
</div></div></div>

<script>
const KEY="vardies_v1";
let state=JSON.parse(localStorage.getItem(KEY)||"null")||{names:["ΔΗΜΗΤΡΗΣ","ΧΡΗΣΤΟΣ","ΚΩΣΤΑΣ","ΣΤΕΦΑΝΟΣ","ΝΙΚΟΣ"],weeks:{}};
let blob,url;

const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const fmt=d=>pad(d.getDate())+"/"+pad(d.getMonth()+1);
function monday(d){d=new Date(d);let x=(d.getDay()+6)%7;d.setDate(d.getDate()-x);return d}
week.value=ymd(monday(new Date()));

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function W(){
 let k=week.value;
 if(!state.weeks[k])state.weeks[k]={e:Array(7).fill(""),n:Array(7).fill(""),notes:""};
 return state.weeks[k]
}
function dates(){
 let b=new Date(week.value+"T12:00");
 for(let i=0;i<7;i++){let x=new Date(b);x.setDate(b.getDate()+i);document.getElementById("d"+i).textContent=fmt(x)}
}
function render(){
 dates();let w=W();
 document.querySelectorAll("select[data-s]").forEach(s=>{
  let val=w[s.dataset.s][+s.dataset.d];
  s.innerHTML='<option value="">—</option>'+state.names.map(n=>`<option>${n}</option>`).join("");
  s.value=val;s.onchange=()=>{w[s.dataset.s][+s.dataset.d]=s.value;save();people()}
 });
 notes.value=w.notes;notes.oninput=()=>{w.notes=notes.value;save()};
 people()
}
function people(){
 let p=document.getElementById("people"),w=W();
 p.innerHTML='<div class="head">Όνομα</div><div class="head">Βάρδιες</div><div class="head"></div>';
 state.names.forEach((n,i)=>{
  let count=[...w.e,...w.n].filter(x=>x==n).length;
  p.innerHTML+=`<input value="${n}" onchange="rename(${i},this.value)"><b style="text-align:center">${count}</b><button class="gray" onclick="del(${i})">Διαγρ.</button>`
 })
}
function rename(i,n){let old=state.names[i];n=n.trim().toUpperCase();if(!n)return;Object.values(state.weeks).forEach(w=>{w.e=w.e.map(x=>x==old?n:x);w.n=w.n.map(x=>x==old?n:x)});state.names[i]=n;save();render()}
function addName(){let n=newName.value.trim().toUpperCase();if(!n||state.names.includes(n))return;state.names.push(n);newName.value="";save();render()}
function del(i){if(confirm("Διαγραφή ονόματος;")){let n=state.names[i];state.names.splice(i,1);Object.values(state.weeks).forEach(w=>{w.e=w.e.map(x=>x==n?"":x);w.n=w.n.map(x=>x==n?"":x)});save();render()}}
function thisWeek(){week.value=ymd(monday(new Date()));render()}
function clearWeek(){if(confirm("Καθαρισμός αυτής της εβδομάδας;")){delete state.weeks[week.value];save();render()}}
week.onchange=render;

function makeImage(){
 let w=W(),days=["ΔΕΥΤΕΡΑ","ΤΡΙΤΗ","ΤΕΤΑΡΤΗ","ΠΕΜΠΤΗ","ΠΑΡΑΣΚΕΥΗ","ΣΑΒΒΑΤΟ","ΚΥΡΙΑΚΗ"];
 let b=new Date(week.value+"T12:00"),ds=[];for(let i=0;i<7;i++){let x=new Date(b);x.setDate(b.getDate()+i);ds.push(fmt(x))}
 let c=document.createElement("canvas"),ctx=c.getContext("2d"),WID=1400,L=200,C=(WID-L)/7,H=430;c.width=WID*2;c.height=H*2;ctx.scale(2,2);
 ctx.fillStyle="white";ctx.fillRect(0,0,WID,H);
 function cell(x,y,ww,hh,color,t,bold=false){ctx.fillStyle=color;ctx.fillRect(x,y,ww,hh);ctx.strokeStyle="#777";ctx.strokeRect(x,y,ww,hh);ctx.fillStyle="#111";ctx.font=(bold?"bold ":"")+"20px Arial";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(t||"—",x+ww/2,y+hh/2)}
 ctx.fillStyle="#1f4e78";ctx.fillRect(0,0,WID,70);ctx.fillStyle="white";ctx.font="bold 30px Arial";ctx.textAlign="center";ctx.fillText("ΕΒΔΟΜΑΔΙΑΙΟ ΠΡΟΓΡΑΜΜΑ ΒΑΡΔΙΩΝ",WID/2,43);
 cell(0,70,L,60,"#fff2cc","Βάρδιες",true);days.forEach((x,i)=>cell(L+i*C,70,C,60,"#fff2cc",x,true));
 cell(0,130,L,55,"#e2f0d9","Ημερομηνία",true);ds.forEach((x,i)=>cell(L+i*C,130,C,55,"#e2f0d9",x,true));
 cell(0,185,L,80,"#fce4d6","18:00–00:00",true);w.e.forEach((x,i)=>cell(L+i*C,185,C,80,"#fce4d6",x));
 cell(0,265,L,80,"#fce4d6","00:00–06:00",true);w.n.forEach((x,i)=>cell(L+i*C,265,C,80,"#fce4d6",x));
 cell(0,345,L,70,"#d9eaf7","Σημειώσεις",true);cell(L,345,WID-L,70,"white",w.notes||"");
 c.toBlob(b=>{blob=b;if(url)URL.revokeObjectURL(url);url=URL.createObjectURL(b);img.src=url;preview.style.display="block"},"image/png")
}
function closePreview(){preview.style.display="none"}
function downloadImage(){let a=document.createElement("a");a.href=url;a.download="programma-"+week.value+".png";a.click()}
async function shareImage(){
 let f=new File([blob],"programma-"+week.value+".png",{type:"image/png"});
 if(navigator.share&&navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:"Πρόγραμμα Βαρδιών"});
 else downloadImage()
}
render();
</script>
</body>
</html>
